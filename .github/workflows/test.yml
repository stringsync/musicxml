name: test
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: run tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install
        run: bun install --frozen-lockfile
      - name: test
        run: bin/mxl test --ci
  fix:
    name: check formatting, lint, and types
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: install
        run: bun install --frozen-lockfile
      - name: fix
        run: bin/mxl fix --check
